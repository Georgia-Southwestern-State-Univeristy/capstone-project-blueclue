# Explicitly set 1 worker — Railway containers report many CPU cores to the
# container but we only need one for a static SPA. Spawning 70+ workers
# wastes RAM/CPU and inflates Railway billing.
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Compress text assets to reduce egress bandwidth
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Prevent "upstream sent too big header" when proxy_pass is used.
    # The backend sends helmet + CORS headers that can exceed nginx's 4 KB default.
    proxy_buffer_size       16k;
    proxy_buffers           4 16k;
    proxy_busy_buffers_size 16k;

    include /etc/nginx/conf.d/*.conf;
}
