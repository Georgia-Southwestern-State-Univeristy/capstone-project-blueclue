# Explicitly set 1 worker — Railway containers report many CPU cores to the
# container but we only need one for a static SPA. Spawning 70+ workers
# wastes RAM/CPU and inflates Railway billing.
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Compress text assets to reduce egress bandwidth
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    include /etc/nginx/conf.d/*.conf;
}
